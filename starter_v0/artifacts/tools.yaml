# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng và dừng cho tới lượt trả lời tiếp theo. Dùng khi (a) thiếu
      một thông tin bắt buộc để gọi tool khác cho đúng, hoặc (b) cần xác nhận trước
      một hành động gửi/đăng ra ngoài hội thoại. Luôn truyền response_type tường minh.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi ngắn, chỉ hỏi đúng một thứ đang thiếu."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            Bắt buộc truyền tường minh. Dùng "yes_no" khi xin xác nhận cho một hành
            động (gửi, đăng, publish). Dùng "choice" khi đưa sẵn danh sách lựa chọn
            trong options. Dùng "text" khi cần người dùng cung cấp một giá trị tự do.
        options:
          type: array
          default: []
          items: {type: string}
          description: "Danh sách lựa chọn; chỉ dùng cùng response_type=choice."
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: >-
      Tìm bài đăng trên mạng xã hội (X/Twitter) theo từ khóa. Chỉ dùng khi người dùng
      nói rõ muốn tìm post/tweet/mạng xã hội. Không dùng cho tin tức, bài báo hay tra
      cứu thông tin chung — dùng lookup cho các việc đó.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest = mới nhất theo thời gian; Top = phổ biến nhất."}
        limit: {type: integer, default: 5, description: "Số bài đăng trả về."}
      required: [query]

  - name: lookup
    description: >-
      Tìm thông tin trên web: tin tức, bài báo, kiến thức chung. Đây là tool mặc định
      cho yêu cầu tìm tin hoặc tra cứu khi người dùng không nói rõ là mạng xã hội.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            Chỉ chứa từ khóa chủ đề. Không nhét từ chỉ loại nội dung hay thời gian
            (news, tin tức, hôm nay, tuần này) vào đây — chúng thuộc về topic và timeframe.
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: 'Đặt "news" khi người dùng hỏi tin tức/thời sự; "general" cho tra cứu thông thường.'
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: 'Khớp mốc thời gian người dùng nói: hôm nay → day, tuần này → week, tháng này → month, năm nay → year.'
        max_results: {type: integer, default: 5, description: "Số kết quả trả về."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]
  
  - name: export
    description: >-
      Lưu một digest markdown đã có sẵn thành file trong thư mục exports/ trên máy
      local. Chỉ dùng khi nội dung digest đã tồn tại — tool này không tự tìm dữ liệu
      và không tự trình bày. Luôn gọi lần đầu với confirmed=false để người dùng duyệt
      nội dung; chỉ gọi lại với confirmed=true sau khi người dùng đồng ý rõ ràng.
    parameters:
      type: object
      properties:
        content:
          type: string
          default: ""
          description: "Toàn bộ nội dung markdown cần ghi ra file."
        filename:
          type: string
          default: "digest"
          description: "Tên file, không cần đuôi; ký tự lạ sẽ được thay bằng dấu gạch ngang."
        confirmed:
          type: boolean
          default: false
          description: "Chỉ đặt true sau khi người dùng đã xác nhận rõ ràng. Lần gọi đầu luôn để false."
      required: [content]
  
    - name: cite_check
    description: >-
      Kiểm tra danh sách item đã thu thập có tuân thủ chính sách trích dẫn nội bộ
      không: mỗi item phải có url và source, và item Tier 3 (bài đăng mạng xã hội)
      phải được gắn nhãn chưa xác minh. Dùng trước khi format hoặc chia sẻ digest.
      Không tự tìm dữ liệu — chỉ soi các item được truyền vào.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item cần kiểm tra."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        strict:
          type: boolean
          default: false
          description: "Bật true để loại thẳng mọi item Tier 3 thay vì chỉ cảnh báo."
      required: [items]

  - name: select_items
    description: >-
      Dừng lại và để người dùng tự chọn giữ lại item nào trong danh sách đã tìm
      được. Dùng khi kết quả có nhiều mục và cần con người quyết định nội dung nào
      vào digest. Khác clarify: clarify hỏi thông tin còn thiếu, còn select_items
      trình bày thông tin đã có để người dùng chọn.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item để người dùng chọn."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        question:
          type: string
          default: ""
          description: "Câu hỏi hiển thị phía trên danh sách."
        allow_multiple:
          type: boolean
          default: true
          description: "Cho phép chọn nhiều mục hay chỉ một."
      required: [items]


  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
